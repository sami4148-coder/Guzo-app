services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guzo
      POSTGRES_PASSWORD: guzo_dev_password
      POSTGRES_DB: guzo
    ports:
      - "5432:5432"
    volumes:
      - guzo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guzo -d guzo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guzo_postgres_data:
